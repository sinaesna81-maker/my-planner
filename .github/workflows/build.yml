name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold and add packages
        run: |
          cp lib/main.dart /tmp/main.dart
          flutter create --org com.sina --project-name my_planner --platforms android .
          cp /tmp/main.dart lib/main.dart
          flutter pub add shared_preferences file_picker:^8.3.7 open_filex path_provider shamsi_date
          sed -i 's/android:label="[^"]*"/android:label="My planner"/' android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: my-planner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
