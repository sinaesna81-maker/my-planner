name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold and add packages
        run: |
          cp lib/main.dart /tmp/main.dart
          flutter create --org com.sina --project-name my_planner --platforms android .
          cp /tmp/main.dart lib/main.dart
          flutter pub add shared_preferences file_picker:^8.3.7 open_filex path_provider shamsi_date
          sed -i 's/android:label="[^"]*"/android:label="My planner"/' android/app/src/main/AndroidManifest.xml

      - name: Raise compileSdk of plugins to 36
        run: |
          cat > /tmp/fix.kts <<'EOF'
          subprojects {
              if (project.name != "app") {
                  afterEvaluate {
                      val ext = extensions.findByName("android")
                      if (ext is com.android.build.gradle.BaseExtension) {
                          ext.compileSdkVersion(36)
                      }
                  }
              }
          }

          EOF
          cat /tmp/fix.kts android/build.gradle.kts > /tmp/new.kts
          mv /tmp/new.kts android/build.gradle.kts

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: my-planner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
